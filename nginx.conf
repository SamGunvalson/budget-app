# Native app WebView origins allowed to call the API
map $http_origin $cors_origin {
    default "";
    "https://localhost"     $http_origin;
    "capacitor://localhost" $http_origin;
    "http://localhost"      $http_origin;
}

server {
    listen 8085;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──
    # Security headers rendered by docker-entrypoint.sh.
    # add_header is inherited only when a block declares none of its own, so
    # every location (or `if`) that sets add_header must include this again.
    include /etc/nginx/snippets/security-headers.conf;

    # Optional: restore the real client address when another reverse proxy
    # fronts this container. Mount a real-ip*.conf here with set_real_ip_from /
    # real_ip_header (see docs/SETUP_GUIDE.md). No file = no effect.
    include /etc/nginx/snippets/real-ip*.conf;

    # API proxy: /rest/v1 -> PostgREST, /auth/v1 -> auth service
    include /etc/nginx/snippets/local-proxy.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Service worker — must never be cached or PWA updates won't propagate
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Web app manifest
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Hashed assets — immutable, long cache
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Workbox precache assets (also hashed)
    location /workbox- {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache (so new deploys are picked up)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — send all routes to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access log for favicon/robots to reduce noise
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
