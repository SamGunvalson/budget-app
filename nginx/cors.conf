add_header Access-Control-Allow-Origin   $cors_origin always;
add_header Access-Control-Allow-Methods  "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers  "Authorization, Content-Type, Prefer, Range, Content-Profile, Accept-Profile, apikey, x-client-info" always;
add_header Access-Control-Expose-Headers "Content-Range, Content-Location, Preference-Applied" always;
add_header Access-Control-Max-Age        86400 always;
add_header Vary                          "Origin" always;
