<div id="budget-month" aria-label="Budget App redesign preview">
  <header class="appbar"><div class="brand"><span class="brandmark" aria-hidden="true"><b></b><b></b><b></b></span>Budget App</div><span class="sample">Sample workspace</span></header>
  <nav class="navline" aria-label="Preview screens"><button data-page="Overview" aria-current="page">Overview</button><button data-page="Transactions">Transactions</button><button data-page="Budgets">Budgets</button></nav>
  <main><header class="pagehead"><div><div class="eyebrow" id="month-context">Monthly overview</div><h1 id="month-title">November 2026</h1></div><button class="action" id="entry-toggle" aria-expanded="false" aria-controls="budget-entry"><span aria-hidden="true">＋</span> Quick entry</button></header>
  <form id="budget-entry" hidden><h2>Quick entry</h2><label>Saved template<select name="template"><option>Groceries</option><option>Dining out</option><option>Transportation</option></select></label><label>Amount ($)<input name="amount" type="number" inputmode="decimal" min="0.01" max="999999.99" step="0.01" required></label><button class="action" type="submit">Post expense</button><button class="plain" type="button" id="cancel-entry">Cancel</button></form>
  <div id="month-content"></div><div id="month-status" role="status" class="status"></div></main>
</div>
<style>
#budget-month{--paper:light-dark(#f8f7f2,#171c19);--panel:light-dark(#fffefa,#202722);--ink:light-dark(#1f322a,#f1f3ea);--soft:light-dark(#56665c,#b5c3b7);--line:light-dark(#dbdfd4,#3a453d);--forest:light-dark(#164b3c,#164739);--tint:light-dark(#e4ece0,#313f33);--warn:light-dark(#904119,#f5b887);--warn-bg:light-dark(#fae9d8,#49362c);color:var(--ink);background:var(--paper);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;border:1px solid var(--line);border-radius:16px;overflow:hidden;container-type:inline-size;font-variant-numeric:tabular-nums}
#budget-month *{box-sizing:border-box}#budget-month [hidden]{display:none!important}#budget-month :is(h1,h2,p){margin:0}#budget-month button,#budget-month input,#budget-month select{font:inherit}#budget-month button{cursor:pointer;color:inherit}#budget-month button:focus-visible,#budget-month input:focus-visible,#budget-month select:focus-visible{outline:3px solid #ca8c2c;outline-offset:2px}#budget-month .appbar,#budget-month .navline{display:flex;align-items:center;padding:0 clamp(16px,3.4cqw,36px);background:var(--panel)}#budget-month .appbar{min-height:59px;justify-content:space-between}#budget-month .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.6px}#budget-month .brandmark{display:inline-flex;align-items:flex-end;justify-content:center;gap:3px;padding:7px;width:30px;height:30px;border-radius:8px;background:var(--forest)}#budget-month .brandmark b{width:4px;background:#e7c985;border-radius:2px}#budget-month .brandmark b:nth-child(1){height:8px}#budget-month .brandmark b:nth-child(2){height:12px}#budget-month .brandmark b:nth-child(3){height:16px}#budget-month .sample,#budget-month .sub{font-size:12px;color:var(--soft)}#budget-month .navline{gap:24px;border-bottom:1px solid var(--line)}#budget-month .navline button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 0 12px;color:var(--soft);font-size:13px}#budget-month .navline [aria-current=page]{color:var(--ink);font-weight:650;border-color:var(--ink)}#budget-month main{padding:clamp(17px,3.4cqw,36px)}#budget-month .pagehead,#budget-month .secthead,#budget-month .row,#budget-month .between{display:flex;align-items:center;justify-content:space-between;gap:12px}#budget-month .pagehead{margin-bottom:20px;flex-wrap:wrap}#budget-month .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:650;color:var(--soft);margin-bottom:3px}#budget-month h1,#budget-month .big{font-family:'Baskerville','Iowan Old Style',Georgia,serif;font-weight:400;letter-spacing:-.04em}#budget-month h1{font-size:clamp(32px,4.8cqw,48px);line-height:1.1}#budget-month .action,#budget-month .plain{border:0;border-radius:8px;padding:10px 15px;font-weight:600}#budget-month .action{background:var(--ink);color:var(--panel)}#budget-month .plain{background:var(--tint)}#budget-month .columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(16px,2.5cqw,28px)}#budget-month .hero{background:var(--forest);color:#fbfcf2;border-radius:14px;padding:clamp(19px,2.6cqw,30px);display:flex;flex-direction:column;justify-content:space-between}#budget-month .hero .eyebrow{color:#d8e9d8}#budget-month .big{font-size:clamp(46px,7cqw,75px);line-height:1.02;margin:6px 0 4px}#budget-month .hero p{color:#daeadc;font-size:13px}#budget-month .ticks{height:18px;margin:21px 0 8px;background:linear-gradient(to right,#b8d9ac 0 var(--pct),#477365 var(--pct) 100%);mask-image:repeating-linear-gradient(90deg,#000 0 calc(2.5% - 2px),transparent calc(2.5% - 2px) 2.5%)}#budget-month .herolegend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#ecf4e9}#budget-month h2{font-size:18px;font-weight:650;letter-spacing:-.035em}#budget-month .upcoming{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}#budget-month .row{padding:11px 0;border-bottom:1px solid var(--line)}#budget-month .row:last-child{border-bottom:0}#budget-month .left{display:flex;align-items:center;gap:12px;min-width:0}#budget-month .date{width:38px;flex:0 0 38px;text-align:center;background:var(--tint);border-radius:6px;padding:2px 0;font-weight:650}#budget-month .date small{display:block;font-size:9px;letter-spacing:.08em}#budget-month .name{font-weight:600}#budget-month .money{white-space:nowrap;font-weight:600}#budget-month .bottom{margin-top:26px}#budget-month .secthead{margin-bottom:7px}#budget-month .textbtn{border:0;background:none;color:var(--soft);font-size:12px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}#budget-month .category{padding:12px 0;border-bottom:1px solid var(--line)}#budget-month .category:last-child{border:0}#budget-month .track{background:var(--line);height:5px;border-radius:8px;margin-top:8px;overflow:hidden}#budget-month .track b{display:block;height:100%;background:light-dark(#769a79,#9bbf9d)}#budget-month .over{color:var(--warn)}#budget-month .over .track b{background:var(--warn)}#budget-month .chip{font-size:12px;background:var(--warn-bg);color:var(--warn);padding:3px 8px;border-radius:5px;font-weight:600}#budget-month .ledger{width:100%;border-collapse:collapse}#budget-month .ledger td,#budget-month .ledger th{padding:11px 3px;text-align:left;border-bottom:1px solid var(--line)}#budget-month .ledger th{font-size:12px;color:var(--soft);font-weight:500}#budget-month .ledger :last-child:is(td,th){text-align:right}#budget-month form{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:16px;margin-bottom:18px;border:1px solid var(--line);background:var(--panel);border-radius:12px}#budget-month form h2{width:100%}#budget-month form label{display:grid;gap:3px;color:var(--soft);font-size:12px;flex:1 1 140px}#budget-month :is(select,input){width:100%;border:1px solid var(--line);color:var(--ink);background:var(--paper);border-radius:6px;padding:8px}#budget-month .status:not(:empty){margin-top:12px;color:var(--soft)}#budget-month .full{padding:16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
@container(max-width:660px){#budget-month .columns{grid-template-columns:1fr}#budget-month .bottom{margin-top:20px}#budget-month .hero{min-height:190px}#budget-month .navline button{min-height:44px}#budget-month .textbtn{min-height:44px}#budget-month .ledger .accountcol{display:none}#budget-month .full{padding:12px}#budget-month .navline{gap:18px}}
</style>
<script>
(()=>{
 const root=document.getElementById('budget-month');
 const content=root.querySelector('#month-content'), form=root.querySelector('form'), toggle=root.querySelector('#entry-toggle'), status=root.querySelector('#month-status');
 const categories=[['Dining out',18000,20400],['Groceries',55000,46800],['Transportation',22000,13600],['Housing',160000,160000],['Utilities',27000,14200],['Other expenses',48000,17800]];
 const recent=[['Westside Market','Groceries',2645,26],['Copper Kettle','Dining out',3800,25],['Metro Transit','Transportation',1250,25],['Corner Bakery','Dining out',975,24]];
 const upcoming=[[27,'Internet','Monthly bill',6500],[28,'Electricity','Monthly bill',6300],[30,'Paycheck','Recurring income',240000]];
 const usd=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:c%100?2:0,maximumFractionDigits:2}).format(c/100);
 let page='Overview', added=[];
 const pages=['Overview','Transactions','Budgets'];
 function restore(saved){if(!saved)return;page=pages.includes(saved.page)?saved.page:'Overview';added=Array.isArray(saved.added)?saved.added.filter(r=>Array.isArray(r)&&categories.slice(0,3).some(c=>c[0]===r[0])&&Number.isSafeInteger(r[1])&&r[1]>0&&r[1]<=99999999).slice(0,50):[];}
 function save(){window.openai?.setWidgetState?.({modelContent:{screen:page},privateContent:{page,added}})?.catch(()=>{});}
 const section=(title,link,target)=>`<div class="secthead"><h2>${title}</h2>${link?`<button type="button" class="textbtn" data-page="${target}">${link} →</button>`:''}</div>`;
 const spend=c=>c[2]+added.reduce((s,r)=>s+(r[0]===c[0]?r[1]:0),0);
 function category(c){const used=spend(c),left=c[1]-used;return `<div class="category ${left<0?'over':''}"><div class="between"><span class="name">${c[0]}</span><span class="${left<0?'chip':'money'}">${usd(Math.abs(left))} ${left<0?'over':'left'}</span></div><div class="sub">${usd(used)} of ${usd(c[1])}</div><div class="track" aria-hidden="true"><b style="width:${Math.min(100,used/c[1]*100)}%"></b></div></div>`;}
 function render(){
 root.querySelectorAll('.navline button').forEach(b=>b.dataset.page===page?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 root.querySelector('#month-context').textContent=page==='Overview'?'Monthly overview':'November 2026';root.querySelector('h1').textContent=page==='Overview'?'November 2026':page;
 const tx=[...added.map(([cat,amt])=>[cat+' purchase',cat,amt,26]),...recent];
 if(page==='Budgets'){content.innerHTML=`<section class="full">${section('Monthly spending plan')}${categories.map(category).join('')}</section>`;return;}
 if(page==='Transactions'){content.innerHTML=`<section class="full">${section('Recent posted expenses')}<table class="ledger"><thead><tr><th>Date</th><th>Transaction</th><th class="accountcol">Account</th><th>Amount</th></tr></thead><tbody>${tx.map(r=>`<tr><td>Nov ${r[3]}</td><td><div class="name">${r[0]}</div><div class="sub">${r[1]}</div></td><td class="accountcol">Checking</td><td class="money">−${usd(r[2])}</td></tr>`).join('')}</tbody></table></section>`;return;}
 const plan=categories.reduce((s,c)=>s+c[1],0),used=categories.reduce((s,c)=>s+spend(c),0),pct=Math.round(100*used/plan), left=plan-used;
 content.innerHTML=`<div class="columns"><section class="hero"><div><div class="eyebrow">${left>=0?'Left in your spending plan':'Over your spending plan'}</div><div class="big">${usd(Math.abs(left))}</div><p>${usd(used)} spent of ${usd(plan)} budgeted</p></div><div><div class="ticks" style="--pct:${Math.min(100,pct)}%" aria-hidden="true"></div><div class="herolegend"><span>${pct}% used</span><span>Through Nov 26</span></div></div></section><section class="upcoming">${section('Coming up')}${upcoming.map(([day,name,type,amt])=>`<div class="row"><div class="left"><div class="date"><small>NOV</small>${day}</div><div><div class="name">${name}</div><div class="sub">${type}</div></div></div><div class="money">${type==='Recurring income'?'+':'−'}${usd(amt)}</div></div>`).join('')}</section></div><div class="columns bottom"><section>${section('Category watch','All budgets','Budgets')}${categories.slice(0,3).map(category).join('')}</section><section>${section('Recent activity','Transactions','Transactions')}${tx.slice(0,3).map(r=>`<div class="row"><div><div class="name">${r[0]}</div><div class="sub">Nov ${r[3]} · ${r[1]}</div></div><span class="money">−${usd(r[2])}</span></div>`).join('')}</section></div>`;
 }
 function showForm(open){form.hidden=!open;toggle.setAttribute('aria-expanded',String(open));if(open)form.elements.amount.focus();}
 root.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;status.textContent='';showForm(false);render();root.querySelector(`.navline [data-page="${page}"]`).focus({preventScroll:true});save();});
 toggle.addEventListener('click',()=>{status.textContent='';showForm(form.hidden);});root.querySelector('#cancel-entry').addEventListener('click',()=>{showForm(false);toggle.focus();});
 form.addEventListener('submit',e=>{e.preventDefault();const cat=form.elements.template.value, amt=Math.round(form.elements.amount.valueAsNumber*100);if(!Number.isSafeInteger(amt)||amt<=0)return;if(added.length>=50){status.textContent='The sample workspace holds 50 new entries.';return;}added.unshift([cat,amt]);form.reset();showForm(false);render();status.textContent=`${usd(amt)} posted to ${cat} in the sample workspace.`;toggle.focus();save();});
 restore(window.openai?.widgetState?.privateContent);render();window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved){restore(saved);render();}});
})();
</script>
