name: Build & Publish Docker Image

# Triggers:
#   - Push to main        → bumps patch version, pushes 'edge' + versioned + 'latest' images in one run
#   - Push a semver tag   → builds full semver image set (for manual version overrides)
#   - Pull request        → build-only smoke test (no push)
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.0.0, v2.3.1
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/budget-app

jobs:
  # ── 1. Quality gates ───────────────────────────────────────────────────────
  audit:
    name: Security & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint

  # ── 2. Build & push ────────────────────────────────────────────────────────
  selfhost-smoke:
    name: Self-hosted Deployment Smoke Test
    runs-on: ubuntu-latest
    needs: audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v4
      - name: Build test images
        run: |
          docker buildx build --load -t thewarguy/budget-app-db:selfhost-test ./sql_scripts
          docker buildx build --load -t thewarguy/budget-app-auth:selfhost-test ./server/auth
          docker buildx build --load -t thewarguy/budget-app:selfhost-test .
      - name: Test image-only deployment and persistence
        run: node --test scripts/test-selfhost.test.js

  release:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    needs: [audit, selfhost-smoke]
    permissions:
      contents: write   # required to create the version tag
    outputs:
      version: ${{ steps.bump.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history required for version calculation

      # On main pushes: calculate and create the next patch tag (e.g. v0.0.1 → v0.0.2).
      # The output is consumed directly below — no re-trigger needed, no GITHUB_TOKEN loop issue.
      - name: Auto-bump version tag
        id: bump
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  build-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: budget-app
            context: .
          - image: budget-app-auth
            context: ./server/auth
          - image: budget-app-db
            context: ./sql_scripts
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive image tags:
      #   main push   →  edge  +  v0.0.2  +  latest  +  sha-abc1234
      #   tag push    →  1.2.3  +  1.2  +  1  +  latest  +  sha-abc1234
      #   PR          →  sha-abc1234 (build only, not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'thewarguy' }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Budget App
            org.opencontainers.image.description=Personal budget tracker with offline support
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build (and push if not a PR)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # PRs only need amd64 for a smoke test; full multi-arch only on real pushes.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Credentials are NOT baked in — injected at runtime by docker-entrypoint.sh
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance attestations add ~30-60s overhead with no benefit for this image.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ── 3. Docker Scout CVE scan ───────────────────────────────────────────────
  scout:
    name: Docker Scout CVE Scan
    runs-on: ubuntu-latest
    needs: build-push
    # Only scan after a real push (image must be in the registry)
    if: github.event_name == 'push'
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout - scan edge image for CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:edge
          # Fail the workflow only on critical CVEs that have a fix available,
          # so a missed upgrade in the Dockerfile blocks the release immediately.
          only-severities: critical
          only-fixed: true
          exit-code: true
          sarif-file: scout-results.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()   # upload even when the scan step fails
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scout-results.sarif
