# Native app WebView origins allowed to call the API
map $http_origin $cors_origin {
    default "";
    "https://localhost"     $http_origin;
    "capacitor://localhost" $http_origin;
    "http://localhost"      $http_origin;
}

server {
    listen 8085;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──
    # Security headers (incl. mode-specific CSP) rendered by docker-entrypoint.sh.
    # Locations that set their own add_header must include this again.
    include /etc/nginx/snippets/security-headers.conf;

    # Local-mode API proxy (empty in supabase mode)
    include /etc/nginx/snippets/local-proxy.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Service worker — must never be cached or PWA updates won't propagate
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Web app manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Runtime environment config — never cache. Holds the Supabase URL +
    # anon key templated in by docker-entrypoint.sh; an anon-key rotation must
    # propagate to all clients on the next page load.
    location = /env-config.js {
        # Allow native app WebView origins to fetch runtime config during setup.
        if ($http_origin ~* "^https://localhost$|^capacitor://localhost$") {
            add_header Access-Control-Allow-Origin $http_origin always;
        }
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Vary "Origin" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Hashed assets — immutable, long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Workbox precache assets (also hashed)
    location /workbox- {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache (so new deploys are picked up)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — send all routes to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access log for favicon/robots to reduce noise
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
