<div id="pocket-ledger" class="viz-dotted-background">
  <section class="phone" aria-label="Mobile Transactions prototype">
    <header class="app-head"><span class="wordmark"><span class="mark" aria-hidden="true">≋</span>Budget App</span><span class="workspace">Sample workspace</span></header>
    <section id="pl-list">
      <div class="mast"><div class="kicker">November 2026</div><h1>Transactions</h1></div>
      <div class="tabs" aria-label="Transaction status"><button type="button" data-filter="posted" aria-pressed="true">Posted</button><button type="button" data-filter="pending" aria-pressed="false">Pending <span id="pl-count"></span></button></div>
      <div id="pl-rows"></div>
      <footer class="dock"><button class="secondary" id="pl-quick" type="button"><i data-lucide="zap" aria-hidden="true"></i> Templates</button><button class="primary" id="pl-new" type="button"><span aria-hidden="true">＋</span> Add transaction</button></footer>
    </section>
    <section id="pl-editor" hidden></section><div role="status" id="pl-notice"></div>
  </section>
</div>
<style>
#pocket-ledger{--paper:light-dark(#fffdf8,#21231e);--ink:light-dark(#222b24,#f3f1e6);--soft:light-dark(#596459,#bcc4b7);--rule:light-dark(#e1e3d8,#42473c);--wash:light-dark(#f0f1e8,#30342c);--amber:#f3be53;--income:light-dark(#256449,#a7dbaf);display:grid;justify-items:center;padding:16px 0;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
#pocket-ledger *{box-sizing:border-box}#pocket-ledger [hidden]{display:none!important}#pocket-ledger .phone{width:min(100%,392px);min-width:0;border:1px solid var(--rule);border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:0 8px 26px #15241514}#pocket-ledger button,#pocket-ledger select,#pocket-ledger input{font:inherit;color:inherit}#pocket-ledger button{cursor:pointer;min-height:44px;background:none;border:0}#pocket-ledger :focus-visible{outline:3px solid #b07c23;outline-offset:-3px}#pocket-ledger :is(h1,h2,p){margin:0}#pocket-ledger .app-head,#pocket-ledger .wordmark,#pocket-ledger .tabs,#pocket-ledger .dock,#pocket-ledger .back,#pocket-ledger .choice{display:flex;align-items:center}#pocket-ledger .app-head{justify-content:space-between;padding:15px 19px;border-bottom:1px solid var(--rule)}#pocket-ledger .wordmark{gap:7px;font-weight:700;letter-spacing:-.03em}#pocket-ledger .mark{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;color:#302811;background:var(--amber);font:bold 25px/1 Georgia}#pocket-ledger .workspace,#pocket-ledger .sub{font-size:12px;color:var(--soft)}#pocket-ledger .mast{padding:22px 19px 16px}#pocket-ledger .kicker,#pocket-ledger .day{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}#pocket-ledger h1,#pocket-ledger h2{font:500 37px/1.14 'Iowan Old Style',Baskerville,Georgia,serif;letter-spacing:-.045em;margin-top:4px}#pocket-ledger .tabs{gap:5px;margin:0 19px 17px;padding:3px;background:var(--wash);border-radius:12px}#pocket-ledger .tabs button{flex:1;min-height:44px;border-radius:9px;font-size:14px;font-weight:600}#pocket-ledger .tabs [aria-pressed=true]{background:var(--ink);color:var(--paper)}#pocket-ledger #pl-count{font-size:12px;margin-left:4px}#pocket-ledger #pl-rows{padding:0 19px 8px;max-height:360px;min-height:280px;overflow:auto;overscroll-behavior:contain}#pocket-ledger .day{margin:12px 0 4px}#pocket-ledger .tx{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:64px;padding:9px 0;border-bottom:1px solid var(--rule);text-align:left}#pocket-ledger .avatar{display:grid;place-items:center;background:var(--wash);width:35px;height:38px;border-radius:10px;color:var(--soft)}#pocket-ledger .avatar svg{width:17px;height:17px}#pocket-ledger .name,#pocket-ledger .amount{display:block;font-size:15px;font-weight:650}#pocket-ledger .name{overflow-wrap:anywhere}#pocket-ledger .sub{display:block;margin-top:2px}#pocket-ledger .plus-income{color:var(--income)}#pocket-ledger .dock{padding:14px 16px max(14px,env(safe-area-inset-bottom));gap:8px;border-top:1px solid var(--rule);background:var(--paper)}#pocket-ledger .primary,#pocket-ledger .secondary{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:10px;font-weight:650}#pocket-ledger .primary{flex:1;background:var(--amber);color:#312810}#pocket-ledger .secondary{background:var(--wash)}#pocket-ledger .back{padding:0;color:var(--soft);gap:6px}#pocket-ledger #pl-editor{padding:8px 19px 18px}#pocket-ledger .choice{width:100%;justify-content:space-between;border-bottom:1px solid var(--rule);text-align:left;padding:12px 0}#pocket-ledger #pl-editor h2{margin:4px 0 15px;font-size:32px}#pocket-ledger form{display:grid;gap:11px}#pocket-ledger label{display:grid;gap:4px;color:var(--soft);font-size:12px;font-weight:600}#pocket-ledger :is(input,select){width:100%;min-width:0;min-height:44px;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;color:var(--ink);background:var(--paper);font-size:16px}#pocket-ledger input[name=amount]{font-size:30px;font-weight:650}#pocket-ledger .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}#pocket-ledger #pl-notice:not(:empty){padding:8px 19px 12px;font-size:13px;color:var(--income)}#pocket-ledger .pending-actions{display:flex;gap:8px}#pocket-ledger .pending-actions button{flex:1}#pocket-ledger .empty{padding:22px 0;color:var(--soft)}#pocket-ledger .back:before{content:'‹';font-size:22px}
</style>
<script>
(()=>{
 const root=document.getElementById('pocket-ledger'), list=root.querySelector('#pl-list'),editor=root.querySelector('#pl-editor'), rows=root.querySelector('#pl-rows'),notice=root.querySelector('#pl-notice');
 const today='2026-11-26',money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}),accounts=['Checking','Credit card'],categoryIcons={'Groceries':'shopping-basket','Dining out':'coffee','Transit':'train-front','Income':'briefcase-business','Utilities':'house','Other':'wallet'};
 const seeds=[['Westside Market','Groceries','Credit card',2645,26],['Morning coffee','Dining out','Checking',475,26],['Metro Transit','Transit','Checking',1250,25],['Paycheck','Income','Checking',145000,25],['Internet bill','Utilities','Checking',6500,26,'pending'],['Electric bill','Utilities','Checking',6300,25,'pending']];
 const templates=[['Morning coffee','Dining out','Checking'],['Westside Market','Groceries','Credit card'],['Metro Transit','Transit','Checking']];
 let items=seeds.map(([name,category,account,cents,day,state],id)=>({id,name,category,account,cents,date:'2026-11-'+day,state:state||'posted'})),filter='posted',next=items.length,opener=null;
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
 const icons=()=>window.lucide?.createIcons({attrs:{width:16,height:16}});
 const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
 function draw(){root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));root.querySelector('#pl-count').textContent=items.filter(i=>i.state==='pending').length;
 const visible=items.filter(i=>i.state===filter).sort((a,b)=>b.date.localeCompare(a.date)||((a.id>=seeds.length||b.id>=seeds.length)?b.id-a.id:a.id-b.id));let previous='';
 rows.innerHTML=visible.map(i=>{const group=i.date===previous?'':'<div class="day">'+(i.date===today?'Today · ':i.date==='2026-11-25'?'Yesterday · ':'')+fmt(i.date)+'</div>';previous=i.date;
 return group+'<button class="tx" data-item="'+i.id+'"><span class="avatar">'+icon(categoryIcons[i.category])+'</span><span><span class="name">'+esc(i.name)+'</span><span class="sub">'+i.category+' · '+i.account+'</span></span><span class="amount '+(i.category==='Income'?'plus-income':'')+'">'+(i.category==='Income'?'+':'−')+money.format(i.cents/100)+'</span></button>';}).join('')||'<p class="empty">No '+filter+' transactions.</p>';icons();}
 function show(html){list.hidden=true;editor.hidden=false;notice.textContent='';editor.innerHTML='<button type="button" class="back" data-back>Transactions</button>'+html;icons();}
 function close(msg=''){editor.hidden=true;editor.replaceChildren();list.hidden=false;draw();notice.textContent=msg;(opener?.isConnected?opener:root.querySelector('[data-filter="'+filter+'"]')).focus({preventScroll:true});}
 function templateList(){show('<h2>Saved templates</h2>'+templates.map(([name,cat,account],ix)=>'<button class="choice" data-template="'+ix+'"><span><b>'+name+'</b><span class="sub">'+cat+' · '+account+'</span></span><span aria-hidden="true">›</span></button>').join(''));editor.querySelector('[data-template]').focus({preventScroll:true});}
 function options(arr,selected){return arr.map(v=>'<option'+(v===selected?' selected':'')+'>'+v+'</option>').join('');}
 function openForm(i,fromTemplate=false){const existing=i.id!==undefined,pending=i.state==='pending';show('<h2>'+(pending?'Review pending':existing?'Edit transaction':fromTemplate?'Quick entry':'Add transaction')+'</h2><form><label>Amount ($)<input type="number" name="amount" min="0.01" max="9999999.99" step="0.01" inputmode="decimal" required value="'+(existing?(i.cents/100).toFixed(2):'')+'"></label><label>Payee or description<input name="name" maxlength="70" required value="'+esc(i.name||'')+'"></label><div class="pair"><label>Category<select name="category">'+options(Object.keys(categoryIcons),i.category)+'</select></label><label>Account<select name="account">'+options(accounts,i.account)+'</select></label></div><label>Date<input name="date" type="date" min="2026-11-01" max="2026-11-30" required value="'+(i.date||today)+'"></label><div class="pending-actions">'+(pending?'<button type="button" class="secondary" data-skip>Skip</button>':'')+'<button class="primary" type="submit">'+(pending?'Confirm and post':existing?'Save changes':'Post transaction')+'</button></div></form>');const f=editor.querySelector('form');f.elements.amount.focus({preventScroll:true});if(existing)f.elements.amount.select();
 f.addEventListener('submit',e=>{e.preventDefault();const name=f.elements.namedItem('name').value.trim();if(!name){f.elements.namedItem('name').focus();return;}const updated={id:existing?i.id:next++,name,account:f.elements.account.value,category:f.elements.category.value,date:f.elements.date.value,cents:Math.round(f.elements.amount.valueAsNumber*100),state:'posted'};if(existing)items=items.map(v=>v.id===i.id?updated:v);else items.unshift(updated);filter='posted';close((existing&&!pending?'Saved changes to ':'Posted ')+name+'.');});
 editor.querySelector('[data-skip]')?.addEventListener('click',()=>{items=items.filter(v=>v.id!==i.id);close('Skipped '+i.name+'.');});}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(list.contains(b))opener=b;if(b.hasAttribute('data-back'))close();else if(b.dataset.filter){filter=b.dataset.filter;notice.textContent='';draw();rows.scrollTop=0;}else if(b.id==='pl-quick')templateList();else if(b.id==='pl-new')openForm({category:'Other'});else if(b.hasAttribute('data-item'))openForm(items.find(i=>i.id===Number(b.dataset.item)));else if(b.hasAttribute('data-template')){const [name,category,account]=templates[Number(b.dataset.template)];openForm({name,category,account},true);}});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!editor.hidden)close();});draw();
})();
</script>
